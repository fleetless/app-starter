# Every pull request and every push to `main`: install from the lockfile, lint, typecheck
# (both TypeScript projects), the suite, and a build. Hosted runner: this is
# a public repository, and a pull request here is a stranger's code.
name: verify

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run of the push before it
# (fleetless/fleetless#296). Only `pull_request` runs of the same pull
# request share a group; every other run (a push to `main`, a manual run)
# gets a group of its own, `run_id`, and is never cancelled.
concurrency:
  group: verify-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      # The release logic's own tests, the shared list every copy of
      # release.mjs must pass (spec: "The release logic lives in each
      # repository").
      - run: node --test '.github/release/*.test.mjs'
      - run: pnpm build
